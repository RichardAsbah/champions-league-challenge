<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Champions League Friends Challenge</title>
  <style>
    :root{
      --bg:#050505;
      --panel:#111111;
      --panel2:#181818;
      --text:#f5f5f5;
      --muted:#9ca3af;
      --line:#262626;
      --gold:#f5c542;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{width:100%;max-width:520px;margin:auto;padding:14px 8px 30px}
    .hero{text-align:center;margin:4px 0 14px}
    .hero h1{font-size:clamp(20px,6vw,30px);line-height:1.1;margin:0 0 4px}
    .hero p{font-size:12px;color:var(--muted);margin:0}
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:11px 10px;
      border-bottom:1px solid var(--line);
    }
    .card-head h2{margin:0;font-size:15px}
    #status{font-size:10px;color:var(--muted);white-space:nowrap}
    .table-wrap{width:100%;overflow:hidden}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{padding:10px 3px;text-align:center;border-bottom:1px solid var(--line);font-size:12px}
    th{
      color:var(--muted);
      font-size:9px;
      line-height:1.15;
      text-transform:uppercase;
      letter-spacing:.03em;
      background:var(--panel2);
      white-space:normal;
    }
    th:nth-child(1),td:nth-child(1){width:14%}
    th:nth-child(2),td:nth-child(2){width:28%}
    th:nth-child(3),td:nth-child(3){width:28%}
    th:nth-child(4),td:nth-child(4){width:30%}
    td.player{text-align:left;font-weight:700;padding-left:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    tr:last-child td{border-bottom:none}
    tbody tr:nth-child(1) td:first-child{color:var(--gold);font-weight:900}
    .rank{font-size:14px;font-weight:800}
    .points{font-size:14px;font-weight:900}
    .last-pick{display:inline-block;min-width:42px;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}
    .last-pick.positive{background:#123b22;color:#86efac}
    .last-pick.negative{background:#451a1a;color:#fca5a5}
    .last-pick.neutral{background:#262626;color:#a3a3a3}
    .error{padding:12px 10px;color:#fca5a5;display:none;line-height:1.4;font-size:12px}
    footer{text-align:center;color:var(--muted);font-size:10px;margin-top:12px}

    @media (max-width:380px){
      .wrap{padding-left:5px;padding-right:5px}
      .hero h1{font-size:20px}
      .card-head{padding:9px 8px}
      .card-head h2{font-size:14px}
      th,td{padding:8px 2px;font-size:11px}
      th{font-size:8px}
      .rank,.points{font-size:13px}
      .last-pick{min-width:38px;padding:4px 5px;font-size:10px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🏆 Champions League Challenge</h1>
      <p>Friends leaderboard</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Leaderboard</h2>
        <span id="status">Loading…</span>
      </div>

      <div id="error" class="error"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th style="text-align:left">Player</th>
              <th>Total Points</th>
              <th>Last Pick</th>
            </tr>
          </thead>
          <tbody id="leaderboard"></tbody>
        </table>
      </div>
    </section>

    <footer>Updates automatically from Google Sheets</footer>
  </main>

  <script>
    // PASTE YOUR PUBLISHED GOOGLE SHEETS CSV URL HERE:
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxx2alBo5EsIKDwTCpUVLXjszZtYGHoR7ej9nsmn5vcMfbRoPXglkDx6uFgsq9y0yXwjDxLpCVg_hF/pub?output=csv";

    const tbody = document.getElementById("leaderboard");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quoted && next === '"') {
          cell += '"'; i++;
        } else if (c === '"') {
          quoted = !quoted;
        } else if (c === "," && !quoted) {
          row.push(cell); cell = "";
        } else if ((c === "\n" || c === "\r") && !quoted) {
          if (c === "\r" && next === "\n") i++;
          row.push(cell); cell = "";
          if (row.some(v => v.trim() !== "")) rows.push(row);
          row = [];
        } else {
          cell += c;
        }
      }

      row.push(cell);
      if (row.some(v => v.trim() !== "")) rows.push(row);
      return rows;
    }

    function number(value) {
      const n = Number(String(value ?? "").trim());
      return Number.isFinite(n) ? n : 0;
    }

    async function loadLeaderboard() {
      if (!CSV_URL.startsWith("http")) {
        statusEl.textContent = "Setup needed";
        errorEl.style.display = "block";
        errorEl.textContent = "Open index.html and replace PASTE_YOUR_GOOGLE_SHEETS_CSV_URL_HERE with your published CSV link.";
        return;
      }

      try {
        statusEl.textContent = "Updating…";
        errorEl.style.display = "none";

        const res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
        if (!res.ok) throw new Error("Could not read Google Sheet.");

        const text = await res.text();
        const rows = parseCSV(text);
        if (rows.length < 2) throw new Error("The Leaderboard sheet has no player rows.");

        const headers = rows[0].map(h => h.trim().toLowerCase());
        const index = name => headers.indexOf(name.toLowerCase());

        if (index("player") === -1) {
          throw new Error("Missing column: player");
        }

        const pointsIndex = index("totalpoints") !== -1
          ? index("totalpoints")
          : (index("points") !== -1 ? index("points") : index("startingpoints"));
        const lastPickIndex = index("lastpick");

        const players = rows.slice(1).map(r => ({
          player: (r[index("player")] || "").trim(),
          points: pointsIndex !== -1 ? number(r[pointsIndex]) : 0,
          lastPick: lastPickIndex !== -1 && String(r[lastPickIndex] ?? "").trim() !== ""
            ? number(r[lastPickIndex])
            : null
        })).filter(p => p.player);

        players.sort((a,b) =>
          b.points - a.points ||
          a.player.localeCompare(b.player)
        );

        tbody.innerHTML = players.map((p,i) => {
          const pickClass = p.lastPick === null ? "neutral" : (p.lastPick > 0 ? "positive" : (p.lastPick < 0 ? "negative" : "neutral"));
          const pickText = p.lastPick === null ? "—" : (p.lastPick > 0 ? `+${p.lastPick}` : `${p.lastPick}`);
          return `
          <tr>
            <td class="rank">${i + 1}</td>
            <td class="player">${escapeHTML(p.player)}</td>
            <td class="points">${p.points}</td>
            <td><span class="last-pick ${pickClass}">${pickText}</span></td>
          </tr>`;
        }).join("");

        statusEl.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
      } catch (err) {
        statusEl.textContent = "Error";
        errorEl.style.display = "block";
        errorEl.textContent = err.message;
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    loadLeaderboard();
    setInterval(loadLeaderboard, 60000);
  </script>
</body>
</html>
